openapi: 3.0.3

info:
  title: Community Incident Reporting & Response Platform API
  description: |
    API for the Community Response Hub platform.

    **Synced to implemented backend routes** (v1.4.0).

    Base URL: `http://localhost:5000/api/v1`

    Roles: `admin`, `resident`, `responder`.

    Privacy: Complainant `reported_by` is hidden from responder complaint responses. Admins see full PII.

    Path identifiers: Most complaint paths accept either internal `complaint_id` (UUID) or public `reference_id` (e.g. `CMP-2026-00001`).

    Response conventions:
    - Success payloads typically include `status: "ok"` and a `timestamp` (ISO-8601).
    - Errors return `status: "error"` with a `message`; in non-production environments an `error` field may include internal details.
    - Auth register/login responses use `success: true` with a nested `data` object (legacy shape retained for the mobile client).
  version: 1.4.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local Development

tags:
  - name: Health
    description: Service health checks
  - name: Database
    description: Admin database diagnostics
  - name: Auth
    description: Authentication
  - name: Users
    description: User management
  - name: Verifications
    description: Resident verification workflow
  - name: Admin
    description: Admin-only dashboard and complaint detail views
  - name: Categories
    description: Complaint categories
  - name: Complaints
    description: Complaint reporting and workflow
  - name: Media
    description: Complaint evidence upload
  - name: Activity Logs
    description: Complaint audit trail
  - name: Notifications
    description: User notifications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Complaint not found
        errors:
          type: array
          description: Present for validation failures (express-validator)
          items:
            type: object
            properties:
              msg:
                type: string
        error:
          type: string
          description: Internal error detail (non-production only)
          example: relation "foo" does not exist

    Timestamp:
      type: string
      format: date-time
      example: '2026-06-19T12:00:00.000Z'

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    UserSummary:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        user_code:
          type: string
          example: RES-2026-001
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        profile_image_url:
          type: string
          nullable: true
        role_id:
          type: integer
        role_name:
          type: string
          enum: [admin, resident, responder]
        is_verified:
          type: boolean
        is_active:
          type: boolean
        verification_status:
          type: string
          example: pending
        verification_remarks:
          type: string
          nullable: true
        verification_type:
          type: string
          nullable: true
        document_url:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'

    ComplaintCategory:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        description:
          type: string
          nullable: true

    Complaint:
      type: object
      properties:
        complaint_id:
          type: string
          format: uuid
        reference_id:
          type: string
          example: CMP-2026-00001
        reported_by:
          type: string
          format: uuid
          description: Hidden from responder responses
        category_id:
          type: integer
        category_name:
          type: string
        category_description:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        location_text:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: string
          enum: [pending, under_review, assigned, in_progress, resolved, cancelled, rejected]
        priority_level:
          type: string
          enum: [low, normal, high, urgent]
        remarks:
          type: string
          nullable: true
        assigned_to:
          type: string
          format: uuid
          nullable: true
        assigned_to_first_name:
          type: string
          nullable: true
        assigned_to_last_name:
          type: string
          nullable: true
        assigned_by:
          type: string
          format: uuid
          nullable: true
        assigned_by_first_name:
          type: string
          nullable: true
        assigned_by_last_name:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    ComplaintAssignment:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        complaint_id:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        assigned_by:
          type: string
          format: uuid
        is_active:
          type: boolean
        assigned_at:
          $ref: '#/components/schemas/Timestamp'
        assigned_to_first_name:
          type: string
          nullable: true
        assigned_to_last_name:
          type: string
          nullable: true
        assigned_by_first_name:
          type: string
          nullable: true
        assigned_by_last_name:
          type: string
          nullable: true

    ComplaintMedia:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        complaint_id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        media_url:
          type: string
        media_type:
          type: string
          enum: [image, video]
        uploaded_at:
          $ref: '#/components/schemas/Timestamp'
        is_resident_evidence:
          type: boolean

    ActivityLog:
      type: object
      properties:
        activity_log_id:
          type: string
          format: uuid
        complaint_id:
          type: string
          format: uuid
        performed_by:
          type: string
          format: uuid
          nullable: true
        action_type:
          type: string
          example: complaint_created
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    Notification:
      type: object
      properties:
        notification_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
        entity_type:
          type: string
          enum: [complaint, verification]
        entity_id:
          type: string
          format: uuid
        message:
          type: string
        is_read:
          type: boolean
        read_at:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'

    DashboardStat:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: integer
        icon:
          type: string
        accentColor:
          type: string
        iconBackground:
          type: string

    ChartSegment:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
        color:
          type: string

    TrendPoint:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer

    RecentComplaintItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceId:
          type: string
        title:
          type: string
        status:
          type: string
        date:
          type: string
        emoji:
          type: string

    SystemMetric:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
        icon:
          type: string
        accentColor:
          type: string

    AdminDashboardData:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/DashboardStat'
        statusBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ChartSegment'
        trendPoints:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        recentComplaints:
          type: array
          items:
            $ref: '#/components/schemas/RecentComplaintItem'
        systemOverview:
          type: array
          items:
            $ref: '#/components/schemas/SystemMetric'

    AdminComplaintDetails:
      type: object
      properties:
        status:
          type: string
          example: ok
        complaint:
          $ref: '#/components/schemas/Complaint'
        category:
          type: object
          properties:
            category_name:
              type: string
            description:
              type: string
              nullable: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintAssignment'
        media:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintMedia'
        activityLogs:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'
        timestamp:
          $ref: '#/components/schemas/Timestamp'

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: Community Response Hub Backend
                  status:
                    type: string
                    example: healthy
                  uptimeSeconds:
                    type: number
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /db:
    get:
      tags: [Database]
      summary: Database connectivity check
      description: Admin only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: boolean
                  ping:
                    type: integer
                  environment:
                    type: string
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden

  /db/stats:
    get:
      tags: [Database]
      summary: Database table counts
      description: Admin only. Returns raw row counts for users, complaints, and categories.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stats retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      user_count:
                        type: string
                      complaint_count:
                        type: string
                      category_count:
                        type: string
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register resident
      description: Rate limited (20 requests / 15 min per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                phoneNumber:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too many attempts

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Rate limited (20 requests / 15 min per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Account inactive
        '429':
          description: Too many attempts

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Stateless JWT — client should discard tokens locally.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout acknowledged

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access token issued
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: roleId
          schema:
            type: integer
        - in: query
          name: isActive
          schema:
            type: string
            enum: ['true', 'false']
        - in: query
          name: verificationStatus
          schema:
            type: string
            enum: [pending, approved, rejected, not_submitted]
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  count:
                    type: integer
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
        '403':
          description: Forbidden

    post:
      tags: [Users]
      summary: Create user
      description: Admin only. Creates a pre-verified user. Returns `temporaryPassword` when no password is supplied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, role_id]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone_number:
                  type: string
                  nullable: true
                address:
                  type: string
                  nullable: true
                role_id:
                  type: integer
                  description: '1=resident, 2=responder, 3=admin (typical seed values)'
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: User created
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  user:
                    $ref: '#/components/schemas/UserSummary'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /users/responders:
    get:
      tags: [Users]
      summary: List active responders
      description: Admin only. Used for complaint assignment dropdowns.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Responder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                          format: uuid
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Admin or the user themselves.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
        '403':
          description: Forbidden
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    patch:
      tags: [Users]
      summary: Update user profile
      description: Admin or the user themselves.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone_number:
                  type: string
                address:
                  type: string
                profile_image_url:
                  type: string
      responses:
        '200':
          description: User updated
        '400':
          description: No fields to update
        '403':
          description: Forbidden

  /users/me/verification:
    post:
      tags: [Verifications]
      summary: Submit residency verification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [verificationType, address, file]
              properties:
                verificationType:
                  type: string
                  example: ID
                address:
                  type: string
                file:
                  type: string
                  format: binary
                  description: JPG, PNG, or PDF (max 5 MB image / 10 MB PDF)
      responses:
        '200':
          description: Verification submitted
        '400':
          description: Validation error or missing document

  /users/{userId}/verification/review:
    patch:
      tags: [Verifications]
      summary: Approve or reject verification
      description: Admin only. Sets `is_verified` on approval.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationStatus]
              properties:
                verificationStatus:
                  type: string
                  enum: [approved, rejected]
                remarks:
                  type: string
                  description: Required when rejecting
      responses:
        '200':
          description: Verification reviewed
        '403':
          description: Forbidden
        '404':
          description: User or verification not found

  /users/{userId}/activate:
    patch:
      tags: [Users]
      summary: Activate user account
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User activated

  /users/{userId}/deactivate:
    patch:
      tags: [Users]
      summary: Deactivate user account
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard data
      description: Admin only. Returns stats cards, status breakdown, trend chart, recent complaints, and system overview metrics.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    $ref: '#/components/schemas/AdminDashboardData'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
        '403':
          description: Forbidden

  /admin/complaints/{complaintId}/details:
    get:
      tags: [Admin]
      summary: Admin complaint detail aggregate
      description: Admin only. Returns complaint, category, assignment history, media, and activity logs in one response.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
          description: UUID or reference_id
      responses:
        '200':
          description: Aggregated complaint details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaintDetails'
        '404':
          description: Complaint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /categories:
    get:
      tags: [Categories]
      summary: List complaint categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  count:
                    type: integer
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintCategory'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

    post:
      tags: [Categories]
      summary: Create category
      description: Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryName]
              properties:
                categoryName:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Category created

  /categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category by ID
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category details
        '404':
          description: Not found

    patch:
      tags: [Categories]
      summary: Update category
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryName:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated

    delete:
      tags: [Categories]
      summary: Delete category
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category deleted

  /complaints:
    post:
      tags: [Complaints]
      summary: Create complaint
      description: Verified resident only. Media is uploaded separately via `POST /complaints/{id}/media`. Rate limited on write endpoints.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, title, description, locationText]
              properties:
                categoryId:
                  type: integer
                title:
                  type: string
                  minLength: 5
                  maxLength: 100
                description:
                  type: string
                  minLength: 10
                locationText:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                priorityLevel:
                  type: string
                  enum: [low, normal, high, urgent]
      responses:
        '201':
          description: Complaint created
        '400':
          description: Validation error
        '403':
          description: Not verified

    get:
      tags: [Complaints]
      summary: List complaints
      description: Role-aware listing. Admin sees all; resident sees own; responder sees assigned.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: statusGroup
          schema:
            type: string
            enum: [active, closed, resolved]
          description: 'active=pending|under_review|assigned|in_progress; closed=cancelled|rejected; resolved=resolved'
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, under_review, assigned, in_progress, resolved, cancelled, rejected]
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: priorityLevel
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - in: query
          name: assignedToUserId
          schema:
            type: string
          description: Responder UUID, or `unassigned`
        - in: query
          name: search
          schema:
            type: string
          description: Matches title, reference_id, or description
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: Paginated complaint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  count:
                    type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  complaints:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /complaints/my:
    get:
      tags: [Complaints]
      summary: List my complaints
      description: Authenticated resident's own complaints.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Complaint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  count:
                    type: integer
                  complaints:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /complaints/{complaintId}:
    get:
      tags: [Complaints]
      summary: Get complaint by ID or reference
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complaint details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    $ref: '#/components/schemas/Complaint'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
        '403':
          description: Forbidden
        '404':
          description: Not found

    delete:
      tags: [Complaints]
      summary: Delete pending complaint
      description: Verified resident only. Only `pending` complaints owned by the caller can be deleted (e.g. after failed media upload).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complaint deleted
        '400':
          description: Complaint is not pending
        '403':
          description: Forbidden

  /complaints/{complaintId}/status:
    patch:
      tags: [Complaints]
      summary: Update complaint status
      description: |
        Admin or assigned responder.
        Responders may only set `in_progress` or `resolved`.
        Resolving requires remarks (min 10 chars) and at least one resolution evidence upload by the responder.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [complaintStatus]
              properties:
                complaintStatus:
                  type: string
                  enum: [pending, under_review, assigned, in_progress, resolved, cancelled, rejected]
                remarks:
                  type: string
      responses:
        '200':
          description: Status updated
        '400':
          description: Invalid status or missing resolution evidence
        '403':
          description: Forbidden

  /complaints/{complaintId}/assign:
    patch:
      tags: [Complaints]
      summary: Assign or reassign complaint
      description: Admin only. Sets status to `assigned`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedToUserId]
              properties:
                assignedToUserId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Complaint assigned
        '400':
          description: Invalid status for assignment
        '403':
          description: Forbidden

  /complaints/{complaintId}/reject:
    patch:
      tags: [Complaints]
      summary: Reject complaint
      description: Admin only. Sets status to `rejected`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Complaint rejected
        '400':
          description: Reason too short

  /complaints/{complaintId}/cancel:
    patch:
      tags: [Complaints]
      summary: Cancel complaint
      description: Verified resident only. Allowed when status is `pending` or `assigned`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellationReason]
              properties:
                cancellationReason:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Complaint cancelled
        '400':
          description: Invalid status
        '403':
          description: Forbidden

  /complaints/{complaintId}/priority:
    patch:
      tags: [Complaints]
      summary: Update complaint priority
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priorityLevel]
              properties:
                priorityLevel:
                  type: string
                  enum: [low, normal, high, urgent]
      responses:
        '200':
          description: Priority updated
        '403':
          description: Forbidden

  /complaints/{complaintId}/media:
    post:
      tags: [Media]
      summary: Upload complaint media
      description: Up to 5 files per request. Images and videos supported via Cloudinary.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Media uploaded
        '400':
          description: No files provided
        '403':
          description: Forbidden

    get:
      tags: [Media]
      summary: List complaint media
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintMedia'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /complaints/{complaintId}/media/{mediaId}:
    delete:
      tags: [Media]
      summary: Delete complaint media
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media deleted
        '404':
          description: Media not found

  /activity-logs/complaint/{complaintId}:
    get:
      tags: [Activity Logs]
      summary: Get activity logs for a complaint
      description: Admin, owning resident, or assigned responder.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: complaintId
          required: true
          schema:
            type: string
          description: UUID or reference_id
      responses:
        '200':
          description: Activity logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  count:
                    type: integer
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityLog'
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
        '403':
          description: Forbidden
        '404':
          description: Complaint not found

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: is_read
          schema:
            type: boolean
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  count:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  page:
                    type: integer
                  limit:
                    type: integer
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 5

  /notifications/{notificationId}/open:
    put:
      tags: [Notifications]
      summary: Mark notification read and get redirect target
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  entity_type:
                    type: string
                    enum: [complaint, verification]
                  entity_id:
                    type: string
                    format: uuid
                  reference_id:
                    type: string
                    nullable: true
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
        '404':
          description: Notification not found

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                  updatedCount:
                    type: integer
                  timestamp:
                    $ref: '#/components/schemas/Timestamp'
